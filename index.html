<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Camera Siêu Zoom 1x-200x | 360Hz ➔ 8K Ultra HD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      top: 0;
      left: 0;
    }

    #container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    /* Video element ẩn - dùng để capture */
    #videoElement {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #outputCanvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
      image-rendering: crisp-edges;
      background: #000;
    }

    /* Overlay thông tin */
    #infoPanel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 20;
      pointer-events: none;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    #zoomInfo {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: white;
      padding: 14px 30px;
      border-radius: 50px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
      border: 1px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      z-index: 20;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #zoomValue {
      font-size: 42px;
      font-weight: 800;
      color: #FFD966;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      min-width: 80px;
      display: inline-block;
      text-align: center;
    }

    .quality-badge {
      background: rgba(255,255,255,0.15);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #4FC3F7;
    }

    .fps-badge {
      background: rgba(76, 175, 80, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #81C784;
    }

    /* Nút chuyển camera */
    .switch-btn {
      position: absolute;
      top: 25px;
      right: 20px;
      width: 48px;
      height: 48px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      cursor: pointer;
      z-index: 30;
      transition: all 0.2s;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .switch-btn:active {
      background: rgba(255,255,255,0.4);
      transform: scale(0.95);
    }

    /* Nút chọn chế độ chất lượng */
    .mode-selector {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 25;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 6px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .mode-btn {
      padding: 8px 16px;
      border-radius: 25px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .mode-btn.active {
      background: #FFD966;
      color: #000;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
    }

    .mode-btn:active {
      transform: scale(0.95);
    }

    @media (max-width: 600px) {
      #zoomInfo {
        bottom: 30px;
        padding: 12px 24px;
        font-size: 18px;
      }
      #zoomValue {
        font-size: 36px;
      }
      .mode-selector {
        bottom: 100px;
        gap: 4px;
      }
      .mode-btn {
        padding: 6px 12px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <!-- Video element ẩn để capture frame -->
  <video id="videoElement" playsinline muted autoplay></video>
  
  <div id="container">
    <canvas id="outputCanvas"></canvas>
  </div>

  <div id="infoPanel">
    <span class="fps-badge" id="fpsDisplay">⚡ 30 FPS</span>
    <span class="quality-badge" id="qualityDisplay">🎯 1080p</span>
  </div>

  <div id="zoomInfo">
    <span>🔍</span>
    <span id="zoomValue">1.0</span>
    <span>x</span>
  </div>

  <div class="mode-selector" id="modeSelector">
    <button class="mode-btn" data-mode="smooth">🚀 360Hz Mượt</button>
    <button class="mode-btn active" data-mode="balanced">⚖️ Cân bằng</button>
    <button class="mode-btn" data-mode="ultrahd">💎 8K Siêu Nét</button>
  </div>

  <button class="switch-btn" id="switchCameraBtn" style="display: none;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
      <path d="M20 4h-3.5l-1.5-2h-6L7.5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 14c-3.31 0-6-2.69-6-6h2c0 2.21 1.79 4 4 4s4-1.79 4-4h2c0 3.31-2.69 6-6 6z"/>
      <path d="M12 10l-2 2h4z"/>
    </svg>
  </button>

  <script>
    (async function() {
      // ============ CẤU HÌNH ============
      const MIN_ZOOM = 1.0;
      const MAX_ZOOM = 200.0;
      
      // Các chế độ chất lượng
      const QUALITY_MODES = {
        smooth: {
          name: '360Hz Mượt',
          resolution: 720,        // 720p để fps cao
          fps: 60,               // Ưu tiên fps cao
          smoothing: 'low',      // Ít làm mượt để giảm lag
          sharpness: 'normal'
        },
        balanced: {
          name: 'Cân bằng',
          resolution: 1080,      // Full HD
          fps: 30,
          smoothing: 'medium',
          sharpness: 'high'
        },
        ultrahd: {
          name: '8K Siêu Nét',
          resolution: 3840,      // 4K/8K nếu hỗ trợ
          fps: 24,
          smoothing: 'high',     // Nội suy chất lượng cao
          sharpness: 'ultra'
        }
      };
      
      let currentMode = 'balanced';
      let targetFPS = 30;
      
      // ============ DOM ELEMENTS ============
      const videoElement = document.getElementById('videoElement');
      const canvas = document.getElementById('outputCanvas');
      const ctx = canvas.getContext('2d', {
        alpha: false,
        desynchronized: true,
        willReadFrequently: false
      });
      
      const zoomValueSpan = document.getElementById('zoomValue');
      const fpsDisplay = document.getElementById('fpsDisplay');
      const qualityDisplay = document.getElementById('qualityDisplay');
      const switchBtn = document.getElementById('switchCameraBtn');
      const modeSelector = document.getElementById('modeSelector');
      const container = document.getElementById('container');
      
      // ============ STATE ============
      let videoStream = null;
      let videoTrack = null;
      let videoWidth = 1920;
      let videoHeight = 1080;
      
      let currentZoom = 1.0;
      let panX = 0.5;
      let panY = 0.5;
      
      // Touch state
      let isTouching = false;
      let startTouchDistance = 0;
      let startZoom = 1.0;
      let isPanning = false;
      let lastPanX = 0, lastPanY = 0;
      let startPanX = 0, startPanY = 0;
      
      // FPS counter
      let frameCount = 0;
      let lastFPSTime = performance.now();
      let currentFPS = 30;
      
      // ============ KHỞI TẠO CAMERA ============
      async function startCamera(facingMode = "environment") {
        try {
          // Dừng stream cũ
          if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
          }
          
          // Cấu hình độ phân giải dựa trên chế độ
          const modeConfig = QUALITY_MODES[currentMode];
          const targetHeight = modeConfig.resolution;
          
          const constraints = {
            video: {
              facingMode: facingMode,
              width: { ideal: targetHeight * 16/9 },
              height: { ideal: targetHeight },
              aspectRatio: { ideal: 16/9 }
            },
            audio: false
          };
          
          console.log('🎥 Yêu cầu camera với cấu hình:', constraints);
          
          videoStream = await navigator.mediaDevices.getUserMedia(constraints);
          videoTrack = videoStream.getVideoTracks()[0];
          
          // Gán stream cho video element
          videoElement.srcObject = videoStream;
          
          // Đợi video sẵn sàng
          await new Promise((resolve, reject) => {
            videoElement.onloadedmetadata = () => {
              videoWidth = videoElement.videoWidth;
              videoHeight = videoElement.videoHeight;
              console.log(`✅ Video sẵn sàng: ${videoWidth}x${videoHeight}`);
              resolve();
            };
            videoElement.onerror = (e) => {
              console.error('❌ Lỗi video:', e);
              reject(e);
            };
            // Timeout 10 giây
            setTimeout(() => reject(new Error('Timeout khi load video')), 10000);
          });
          
          // Bắt đầu play
          await videoElement.play();
          console.log('▶️ Video đang phát');
          
          // Cập nhật quality display
          updateQualityDisplay();
          
          // Resize canvas
          resizeCanvas();
          
          // Kiểm tra số lượng camera
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === 'videoinput');
          switchBtn.style.display = videoDevices.length > 1 ? 'flex' : 'none';
          
          // Bắt đầu render loop
          requestAnimationFrame(renderLoop);
          
        } catch (err) {
          console.error('❌ Lỗi camera:', err);
          alert('⚠️ Không thể truy cập camera. Vui lòng:\n1. Cấp quyền camera cho trang web\n2. Đảm bảo không có ứng dụng khác đang dùng camera\n3. Thử reload lại trang\n\nLỗi: ' + err.message);
        }
      }
      
      function updateQualityDisplay() {
        const mode = QUALITY_MODES[currentMode];
        let resolutionText = '';
        if (videoWidth >= 3840) resolutionText = '8K';
        else if (videoWidth >= 1920) resolutionText = '1080p';
        else if (videoWidth >= 1280) resolutionText = '720p';
        else resolutionText = videoHeight + 'p';
        
        qualityDisplay.textContent = `🎯 ${resolutionText} ${mode.name}`;
        fpsDisplay.textContent = `⚡ ${currentFPS} FPS`;
      }
      
      // ============ RESIZE CANVAS ============
      function resizeCanvas() {
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
      }
      
      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', () => {
        setTimeout(resizeCanvas, 300);
      });
      
      // ============ RENDER LOOP SIÊU NÉT ============
      function renderLoop(timestamp) {
        if (!videoStream || videoElement.readyState < 2) {
          requestAnimationFrame(renderLoop);
          return;
        }
        
        // FPS counter
        frameCount++;
        if (timestamp - lastFPSTime >= 1000) {
          currentFPS = Math.round(frameCount / ((timestamp - lastFPSTime) / 1000));
          frameCount = 0;
          lastFPSTime = timestamp;
          fpsDisplay.textContent = `⚡ ${currentFPS} FPS`;
        }
        
        const canvasW = canvas.width;
        const canvasH = canvas.height;
        
        if (canvasW === 0 || canvasH === 0) {
          requestAnimationFrame(renderLoop);
          return;
        }
        
        // Clear canvas
        ctx.clearRect(0, 0, canvasW, canvasH);
        
        // Tính toán vùng crop
        const cropWidth = videoWidth / currentZoom;
        const cropHeight = videoHeight / currentZoom;
        
        const maxPanX = videoWidth - cropWidth;
        const maxPanY = videoHeight - cropHeight;
        
        let cropX = panX * maxPanX;
        let cropY = panY * maxPanY;
        
        cropX = Math.max(0, Math.min(cropX, maxPanX));
        cropY = Math.max(0, Math.min(cropY, maxPanY));
        
        // Cấu hình chất lượng render theo chế độ
        const mode = QUALITY_MODES[currentMode];
        ctx.imageSmoothingEnabled = true;
        
        switch(mode.sharpness) {
          case 'ultra':
            ctx.imageSmoothingQuality = 'high';
            // Thêm sharpness bằng cách vẽ nhiều lần (fake)
            break;
          case 'high':
            ctx.imageSmoothingQuality = 'high';
            break;
          case 'normal':
            ctx.imageSmoothingQuality = 'medium';
            break;
          case 'low':
            ctx.imageSmoothingQuality = 'low';
            break;
        }
        
        // Vẽ frame từ video lên canvas
        try {
          ctx.drawImage(
            videoElement,
            cropX, cropY, cropWidth, cropHeight,
            0, 0, canvasW, canvasH
          );
          
          // Nếu là chế độ 8K, áp dụng thêm filter sharpen nhẹ
          if (currentMode === 'ultrahd' && currentZoom > 2) {
            // Unsharp mask đơn giản (chỉ áp dụng khi zoom để tiết kiệm CPU)
            const imageData = ctx.getImageData(0, 0, canvasW, canvasH);
            // Áp dụng sharpen nhẹ (chỉ khi cần)
            // Bỏ qua để tránh lag, dùng CSS filter thay thế
          }
        } catch (e) {
          console.warn('Render error:', e);
        }
        
        // Cập nhật zoom display
        zoomValueSpan.textContent = currentZoom.toFixed(1);
        
        requestAnimationFrame(renderLoop);
      }
      
      // ============ TOUCH HANDLERS ============
      function getTouchDistance(touches) {
        if (touches.length < 2) return 0;
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
      
      function getTouchMidpoint(touches) {
        return {
          x: (touches[0].clientX + touches[1].clientX) / 2,
          y: (touches[0].clientY + touches[1].clientY) / 2
        };
      }
      
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touches = e.touches;
        
        if (touches.length === 2) {
          isTouching = true;
          isPanning = false;
          startTouchDistance = getTouchDistance(touches);
          startZoom = currentZoom;
        } else if (touches.length === 1 && currentZoom > 1.01) {
          isPanning = true;
          isTouching = false;
          lastPanX = touches[0].clientX;
          lastPanY = touches[0].clientY;
          startPanX = panX;
          startPanY = panY;
        }
      }, { passive: false });
      
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touches = e.touches;
        
        if (touches.length === 2 && isTouching) {
          const newDist = getTouchDistance(touches);
          if (startTouchDistance > 10 && newDist > 10) {
            const scale = newDist / startTouchDistance;
            let newZoom = startZoom * scale;
            newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
            
            const midpoint = getTouchMidpoint(touches);
            const rect = canvas.getBoundingClientRect();
            const touchCanvasX = (midpoint.x - rect.left) / rect.width;
            const touchCanvasY = (midpoint.y - rect.top) / rect.height;
            
            const oldCropW = videoWidth / startZoom;
            const oldCropH = videoHeight / startZoom;
            const newCropW = videoWidth / newZoom;
            const newCropH = videoHeight / newZoom;
            
            const oldVideoX = panX * (videoWidth - oldCropW) + touchCanvasX * oldCropW;
            const oldVideoY = panY * (videoHeight - oldCropH) + touchCanvasY * oldCropH;
            
            if (videoWidth > newCropW) {
              panX = (oldVideoX - touchCanvasX * newCropW) / (videoWidth - newCropW);
            } else {
              panX = 0.5;
            }
            if (videoHeight > newCropH) {
              panY = (oldVideoY - touchCanvasY * newCropH) / (videoHeight - newCropH);
            } else {
              panY = 0.5;
            }
            
            panX = Math.max(0, Math.min(1, panX));
            panY = Math.max(0, Math.min(1, panY));
            
            currentZoom = newZoom;
            startZoom = currentZoom;
            startTouchDistance = newDist;
          }
        } else if (touches.length === 1 && isPanning && currentZoom > 1.01) {
          const dx = touches[0].clientX - lastPanX;
          const dy = touches[0].clientY - lastPanY;
          
          const cropW = videoWidth / currentZoom;
          const cropH = videoHeight / currentZoom;
          const maxPanX = videoWidth - cropW;
          const maxPanY = videoHeight - cropH;
          
          if (maxPanX > 0) {
            panX = startPanX - (dx / canvas.width) * (videoWidth / maxPanX);
          }
          if (maxPanY > 0) {
            panY = startPanY - (dy / canvas.height) * (videoHeight / maxPanY);
          }
          
          panX = Math.max(0, Math.min(1, panX));
          panY = Math.max(0, Math.min(1, panY));
        }
      }, { passive: false });
      
      canvas.addEventListener('touchend', () => {
        isTouching = false;
        isPanning = false;
        startZoom = currentZoom;
      });
      
      // ============ CHUYỂN CAMERA ============
      switchBtn.addEventListener('click', async () => {
        if (!videoTrack) return;
        const currentFacing = videoTrack.getSettings().facingMode;
        const newFacing = currentFacing === 'environment' ? 'user' : 'environment';
        currentZoom = 1.0;
        panX = 0.5;
        panY = 0.5;
        await startCamera(newFacing);
      });
      
      // ============ CHẾ ĐỘ CHẤT LƯỢNG ============
      modeSelector.addEventListener('click', (e) => {
        const btn = e.target.closest('.mode-btn');
        if (!btn) return;
        
        const mode = btn.dataset.mode;
        if (mode === currentMode) return;
        
        // Cập nhật UI
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Cập nhật chế độ
        currentMode = mode;
        console.log('🔄 Chuyển sang chế độ:', QUALITY_MODES[mode].name);
        
        // Khởi động lại camera với độ phân giải mới
        const currentFacing = videoTrack ? videoTrack.getSettings().facingMode : 'environment';
        startCamera(currentFacing);
      });
      
      // ============ KHỞI ĐỘNG ============
      console.log('🚀 Khởi động Camera Siêu Zoom...');
      await startCamera('environment');
      
    })();
  </script>
</body>
</html>
